# ECC PKI Compose File - ECDSA P-384 with SHA-384
#
# Run with: sudo podman-compose -f pki-ecc-compose.yml up -d
#
# This creates a complete ECC PKI hierarchy using ECDSA with P-384 curve,
# completely independent from the RSA-4096 and ML-DSA-87 PKI hierarchies.
#
# Network: 172.28.0.0/24 (pki-ecc-net)
# Ports: 8463-8465 (CA), 3389 internal (DS)
#
# NOTE: podman-compose may not honor "condition: service_healthy" in depends_on.
# start-lab.sh provides its own DS readiness checks (LDAP probes) as a safety net.
# The init scripts also call wait_for_ds() internally before running pkispawn.

version: "3.8"

services:
  # 389 Directory Server for ECC Root CA
  ds-ecc-root:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-ecc-root
    hostname: ds-ecc-root.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: ecc-root-ca
    volumes:
      - ds-ecc-root-data:/data
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.14
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  # 389 Directory Server for ECC Intermediate CA
  ds-ecc-intermediate:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-ecc-intermediate
    hostname: ds-ecc-intermediate.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: ecc-intermediate-ca
    volumes:
      - ds-ecc-intermediate-data:/data
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.15
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  # 389 Directory Server for ECC IoT CA
  ds-ecc-iot:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-ecc-iot
    hostname: ds-ecc-iot.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: ecc-iot-ca
    volumes:
      - ds-ecc-iot-data:/data
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.16
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  # Dogtag ECC Root CA - ECDSA P-384 Self-Signed
  dogtag-ecc-root-ca:
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-ecc-root-ca
    hostname: ecc-root-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-ecc-root:
        condition: service_healthy
    environment:
      PKI_DS_URL: ldap://ds-ecc-root.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-ecc-root-ca
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      # ECC-specific settings
      ECC_CA_KEY_TYPE: ecc
      ECC_CA_KEY_ALGORITHM: SHA384withEC
      ECC_CA_KEY_SIZE: nistp384
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/ecc:/certs
      - pki-ecc-root-data:/var/lib/pki
      - pki-ecc-root-logs:/var/log/pki
    extra_hosts:
      - "ds-ecc-root.cert-lab.local:172.28.0.14"
      - "ds-ecc-intermediate.cert-lab.local:172.28.0.15"
      - "ds-ecc-iot.cert-lab.local:172.28.0.16"
      - "ds-ecc-kra.cert-lab.local:172.28.0.24"
      - "ecc-root-ca.cert-lab.local:172.28.0.12"
      - "ecc-intermediate-ca.cert-lab.local:172.28.0.11"
      - "ecc-iot-ca.cert-lab.local:172.28.0.13"
      - "ecc-kra.cert-lab.local:172.28.0.23"
      - "akamu-ecc.cert-lab.local:172.28.0.18"
      - "kipuka-ecc.cert-lab.local:172.28.0.19"
      - "ecc-ocsp.cert-lab.local:172.28.0.22"
      - "ds-ecc-ocsp.cert-lab.local:172.28.0.21"
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.12
    ports:
      - "8463:8443"
      - "8493:8080"
    command: ["/bin/bash", "/scripts/ca-entrypoint.sh"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ca/admin/ca/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Dogtag ECC Intermediate CA - ECDSA P-384
  dogtag-ecc-intermediate-ca:
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-ecc-intermediate-ca
    hostname: ecc-intermediate-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-ecc-intermediate:
        condition: service_healthy
      dogtag-ecc-root-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-ecc-intermediate.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-ecc-intermediate-ca
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      # ECC-specific settings
      ECC_CA_KEY_TYPE: ecc
      ECC_CA_KEY_ALGORITHM: SHA384withEC
      ECC_CA_KEY_SIZE: nistp384
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/ecc:/certs
      - pki-ecc-intermediate-data:/var/lib/pki
      - pki-ecc-intermediate-logs:/var/log/pki
    extra_hosts:
      - "ds-ecc-root.cert-lab.local:172.28.0.14"
      - "ds-ecc-intermediate.cert-lab.local:172.28.0.15"
      - "ds-ecc-iot.cert-lab.local:172.28.0.16"
      - "ds-ecc-kra.cert-lab.local:172.28.0.24"
      - "ecc-root-ca.cert-lab.local:172.28.0.12"
      - "ecc-intermediate-ca.cert-lab.local:172.28.0.11"
      - "ecc-iot-ca.cert-lab.local:172.28.0.13"
      - "ecc-kra.cert-lab.local:172.28.0.23"
      - "akamu-ecc.cert-lab.local:172.28.0.18"
      - "kipuka-ecc.cert-lab.local:172.28.0.19"
      - "ecc-ocsp.cert-lab.local:172.28.0.22"
      - "ds-ecc-ocsp.cert-lab.local:172.28.0.21"
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.11
    ports:
      - "8464:8443"
      - "8494:8080"
    command: ["/bin/bash", "/scripts/ca-entrypoint.sh"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ca/admin/ca/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Dogtag ECC IoT Sub-CA - ECDSA P-384
  dogtag-ecc-iot-ca:
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-ecc-iot-ca
    hostname: ecc-iot-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-ecc-iot:
        condition: service_healthy
      dogtag-ecc-intermediate-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-ecc-iot.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-ecc-iot-ca
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      # ECC-specific settings
      ECC_CA_KEY_TYPE: ecc
      ECC_CA_KEY_ALGORITHM: SHA384withEC
      ECC_CA_KEY_SIZE: nistp384
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/ecc:/certs
      - pki-ecc-iot-data:/var/lib/pki
      - pki-ecc-iot-logs:/var/log/pki
    extra_hosts:
      - "ds-ecc-root.cert-lab.local:172.28.0.14"
      - "ds-ecc-intermediate.cert-lab.local:172.28.0.15"
      - "ds-ecc-iot.cert-lab.local:172.28.0.16"
      - "ds-ecc-kra.cert-lab.local:172.28.0.24"
      - "ecc-root-ca.cert-lab.local:172.28.0.12"
      - "ecc-intermediate-ca.cert-lab.local:172.28.0.11"
      - "ecc-iot-ca.cert-lab.local:172.28.0.13"
      - "ecc-kra.cert-lab.local:172.28.0.23"
      - "akamu-ecc.cert-lab.local:172.28.0.18"
      - "kipuka-ecc.cert-lab.local:172.28.0.19"
      - "ecc-ocsp.cert-lab.local:172.28.0.22"
      - "ds-ecc-ocsp.cert-lab.local:172.28.0.21"
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.13
    ports:
      - "8465:8443"
      - "8495:8080"
    command: ["/bin/bash", "/scripts/ca-entrypoint.sh"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ca/admin/ca/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Enrollment Backend: Akamu + Kipuka (--profile akamu) ──────────────────
  # Activate with: ENROLLMENT_BACKEND=akamu (default)
  # Rust-based ACME CA + EST server, delegating to Dogtag ECC Intermediate CA.

  akamu-ecc:
    profiles: [akamu]
    image: ${AKAMU_IMAGE:-quay.io/czinda/akamu:latest}
    container_name: akamu-ecc
    hostname: akamu-ecc.${LAB_DOMAIN:-cert-lab.local}
    depends_on:
      dogtag-ecc-intermediate-ca:
        condition: service_healthy
    volumes:
      - ./configs/akamu/ecc-config.toml:/app/conf/config.toml:ro,z
      - ./data/certs/ecc:/certs:ro,z
      - akamu-ecc-data:/app/data
    extra_hosts:
      - "ecc-root-ca.cert-lab.local:172.28.0.12"
      - "ecc-intermediate-ca.cert-lab.local:172.28.0.11"
      - "ecc-iot-ca.cert-lab.local:172.28.0.13"
      - "akamu-ecc.cert-lab.local:172.28.0.18"
      - "kipuka-ecc.cert-lab.local:172.28.0.19"
      - "ecc-ocsp.cert-lab.local:172.28.0.22"
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.18
    ports:
      - "8469:8443"
      - "8496:8080"
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/directory > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  kipuka-ecc:
    profiles: [akamu]
    image: ${KIPUKA_IMAGE:-quay.io/czinda/kipuka:latest}
    container_name: kipuka-ecc
    hostname: kipuka-ecc.${LAB_DOMAIN:-cert-lab.local}
    depends_on:
      dogtag-ecc-intermediate-ca:
        condition: service_healthy
    volumes:
      - ./configs/kipuka/ecc-config.toml:/etc/kipuka/kipuka.toml:ro
      - ./data/certs/ecc:/etc/kipuka/certs:ro
      - kipuka-ecc-data:/var/lib/kipuka
    extra_hosts:
      - "ecc-root-ca.cert-lab.local:172.28.0.12"
      - "ecc-intermediate-ca.cert-lab.local:172.28.0.11"
      - "ecc-iot-ca.cert-lab.local:172.28.0.13"
      - "akamu-ecc.cert-lab.local:172.28.0.18"
      - "kipuka-ecc.cert-lab.local:172.28.0.19"
      - "ecc-ocsp.cert-lab.local:172.28.0.22"
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.19
    ports:
      - "8466:9443"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9443/.well-known/est/cacerts 2>/dev/null | head -1 | grep -qE 'BEGIN|MII' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Enrollment Backend: Dogtag EST RA (--profile dogtag-ra) ─────────────────
  # Activate with: ENROLLMENT_BACKEND=dogtag
  # Lightweight Dogtag pki-server instance proxying to ECC Intermediate CA.

  dogtag-ecc-est-ca:
    profiles: [dogtag-ra]
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-ecc-est-ca
    hostname: ecc-est-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      dogtag-ecc-intermediate-ca:
        condition: service_started
    environment:
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-ecc-est-ca
    volumes:
      - ./scripts/pki:/scripts:ro
      - ./data/certs/ecc:/certs
      - pki-ecc-est-data:/var/lib/pki
      - pki-ecc-est-logs:/var/log/pki
    extra_hosts:
      - "ecc-root-ca.cert-lab.local:172.28.0.12"
      - "ecc-intermediate-ca.cert-lab.local:172.28.0.11"
      - "ecc-iot-ca.cert-lab.local:172.28.0.13"
      - "ecc-est-ca.cert-lab.local:172.28.0.18"
      - "ecc-ocsp.cert-lab.local:172.28.0.22"
      - "ds-ecc-ocsp.cert-lab.local:172.28.0.21"
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.18
    ports:
      - "8466:8443"
      - "8496:8080"
    command: ["/bin/bash", "/scripts/ca-entrypoint.sh"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/.well-known/est/cacerts 2>/dev/null | head -1 | grep -qE 'BEGIN|MII' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  # 389 Directory Server for ECC OCSP Responder
  ds-ecc-ocsp:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-ecc-ocsp
    hostname: ds-ecc-ocsp.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: ecc-ocsp
    volumes:
      - ds-ecc-ocsp-data:/data
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.21
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  # Dogtag ECC OCSP Responder - Dedicated OCSP subsystem (ECDSA P-384)
  dogtag-ecc-ocsp:
    image: ${PKI_OCSP_IMAGE:-quay.io/dogtagpki/pki-ocsp:latest}
    container_name: dogtag-ecc-ocsp
    hostname: ecc-ocsp.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-ecc-ocsp:
        condition: service_healthy
      dogtag-ecc-intermediate-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-ecc-ocsp.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-ecc-ocsp
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      ECC_CA_KEY_TYPE: ecc
      ECC_CA_KEY_ALGORITHM: SHA384withEC
      ECC_CA_KEY_SIZE: nistp384
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/ecc:/certs
      - pki-ecc-ocsp-data:/var/lib/pki
      - pki-ecc-ocsp-logs:/var/log/pki
    extra_hosts:
      - "ds-ecc-root.cert-lab.local:172.28.0.14"
      - "ds-ecc-intermediate.cert-lab.local:172.28.0.15"
      - "ds-ecc-ocsp.cert-lab.local:172.28.0.21"
      - "ecc-root-ca.cert-lab.local:172.28.0.12"
      - "ecc-intermediate-ca.cert-lab.local:172.28.0.11"
      - "ecc-iot-ca.cert-lab.local:172.28.0.13"
      - "ecc-ocsp.cert-lab.local:172.28.0.22"
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.22
    ports:
      - "8467:8443"
      - "8497:8080"
    command: ["/bin/bash", "/scripts/ca-entrypoint.sh"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ocsp/admin/ocsp/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  ds-ecc-kra:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-ecc-kra
    hostname: ds-ecc-kra.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: kra
    volumes:
      - ds-ecc-kra-data:/data
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.24
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  dogtag-ecc-kra:
    image: ${PKI_KRA_IMAGE:-quay.io/dogtagpki/pki-kra:latest}
    container_name: dogtag-ecc-kra
    hostname: ecc-kra.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-ecc-kra:
        condition: service_healthy
      dogtag-ecc-intermediate-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-ecc-kra.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-ecc-kra
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/ecc:/certs
      - pki-ecc-kra-data:/var/lib/pki
      - pki-ecc-kra-logs:/var/log/pki
    extra_hosts:
      - "ds-ecc-root.cert-lab.local:172.28.0.14"
      - "ds-ecc-intermediate.cert-lab.local:172.28.0.15"
      - "ds-ecc-kra.cert-lab.local:172.28.0.24"
      - "ecc-root-ca.cert-lab.local:172.28.0.12"
      - "ecc-intermediate-ca.cert-lab.local:172.28.0.11"
      - "ecc-iot-ca.cert-lab.local:172.28.0.13"
      - "ecc-kra.cert-lab.local:172.28.0.23"
    networks:
      pki-ecc-net:
        ipv4_address: 172.28.0.23
    ports:
      - "8468:8443"
      - "8498:8080"
    command: ["/bin/bash", "/scripts/ca-entrypoint.sh"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/kra/admin/kra/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  pki-ecc-net:
    external: true
    name: pki-ecc-net

volumes:
  ds-ecc-root-data:
  ds-ecc-intermediate-data:
