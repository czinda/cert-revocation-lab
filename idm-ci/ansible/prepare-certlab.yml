---
# =============================================================================
# idm-ci: Deploy cert-revocation-lab on a Beaker-provisioned machine
# =============================================================================
#
# Usage:
#   ansible-playbook -i .mrack/ansible-inventory.yaml prepare-certlab.yml
#   ansible-playbook -i .mrack/ansible-inventory.yaml prepare-certlab.yml \
#     -e cert_lab_pki_mode=rsa -e cert_lab_repo_branch=feature/xyz
#
# This playbook has two plays:
#   1. Generate random credentials on localhost (no special chars for pkispawn)
#   2. Deploy the lab on the Beaker machine via the certlab_deploy role

# =============================================================================
# Play 1: Generate Credentials (localhost)
# =============================================================================

- name: Generate deployment credentials
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Generate random admin password
      ansible.builtin.set_fact:
        cert_lab_admin_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
      when: cert_lab_admin_password | default('') | length == 0

    - name: Generate random database password
      ansible.builtin.set_fact:
        cert_lab_db_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
      when: cert_lab_db_password | default('') | length == 0

    - name: Generate random directory server password
      ansible.builtin.set_fact:
        cert_lab_ds_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
      when: cert_lab_ds_password | default('') | length == 0

    - name: Generate random PKI admin password
      ansible.builtin.set_fact:
        cert_lab_pki_admin_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
      when: cert_lab_pki_admin_password | default('') | length == 0

    - name: Generate random PKI PKCS12 password
      ansible.builtin.set_fact:
        cert_lab_pki_client_pkcs12_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
      when: cert_lab_pki_client_pkcs12_password | default('') | length == 0

    - name: Generate random PKI backup password
      ansible.builtin.set_fact:
        cert_lab_pki_backup_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
      when: cert_lab_pki_backup_password | default('') | length == 0

    - name: Generate random PKI token password
      ansible.builtin.set_fact:
        cert_lab_pki_token_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
      when: cert_lab_pki_token_password | default('') | length == 0

    - name: Generate random AWX secret key
      ansible.builtin.set_fact:
        cert_lab_awx_secret_key: "{{ lookup('password', '/dev/null chars=hexdigits length=64') | lower }}"
      when: cert_lab_awx_secret_key | default('') | length == 0

    - name: Generate random Jupyter token
      ansible.builtin.set_fact:
        cert_lab_jupyter_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
      when: cert_lab_jupyter_token | default('') | length == 0

    - name: Generate lab user password
      ansible.builtin.set_fact:
        certlab_user_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
      when: certlab_user_password | default('') | length == 0

    - name: Display credentials summary
      ansible.builtin.debug:
        msg: >-
          Credentials generated. Admin: {{ cert_lab_admin_password }},
          Lab user: {{ certlab_user_password }}

# =============================================================================
# Play 2: Deploy Lab (Beaker machine)
# =============================================================================

- name: Deploy cert-revocation-lab
  hosts: certlab
  become: true
  gather_facts: true

  vars:
    cert_lab_admin_password: "{{ hostvars['localhost']['cert_lab_admin_password'] }}"
    cert_lab_db_password: "{{ hostvars['localhost']['cert_lab_db_password'] }}"
    cert_lab_ds_password: "{{ hostvars['localhost']['cert_lab_ds_password'] }}"
    cert_lab_pki_admin_password: "{{ hostvars['localhost']['cert_lab_pki_admin_password'] }}"
    cert_lab_pki_client_pkcs12_password: "{{ hostvars['localhost']['cert_lab_pki_client_pkcs12_password'] }}"
    cert_lab_pki_backup_password: "{{ hostvars['localhost']['cert_lab_pki_backup_password'] }}"
    cert_lab_pki_token_password: "{{ hostvars['localhost']['cert_lab_pki_token_password'] }}"
    cert_lab_awx_secret_key: "{{ hostvars['localhost']['cert_lab_awx_secret_key'] }}"
    cert_lab_jupyter_token: "{{ hostvars['localhost']['cert_lab_jupyter_token'] }}"
    certlab_user_password: "{{ hostvars['localhost']['certlab_user_password'] }}"

  roles:
    - certlab_deploy
