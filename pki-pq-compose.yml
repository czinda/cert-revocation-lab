# Post-Quantum PKI Compose File - ML-DSA-87 (NIST FIPS 204)
#
# Run with: sudo podman-compose -f pki-pq-compose.yml up -d
#
# This creates a complete Post-Quantum PKI hierarchy using ML-DSA-87,
# completely independent from the RSA-4096 and ECC P-384 PKI hierarchies.
#
# NOTE: ML-DSA-87 requires building Dogtag PKI from the master branch.
# Use the custom image built from containers/dogtag-pq/Containerfile
#
# Network: 172.27.0.0/24 (pki-pq-net)
# Ports: 8453-8455 (CA), 3389 internal (DS)
#
# NOTE: podman-compose may not honor "condition: service_healthy" in depends_on.
# start-lab.sh provides its own DS readiness checks (LDAP probes) as a safety net.
# The init scripts also call wait_for_ds() internally before running pkispawn.

version: "3.8"

services:
  # 389 Directory Server for PQ Root CA
  ds-pq-root:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-pq-root
    hostname: ds-pq-root.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: pq-root-ca
    volumes:
      - ds-pq-root-data:/data
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.14
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  # 389 Directory Server for PQ Intermediate CA
  ds-pq-intermediate:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-pq-intermediate
    hostname: ds-pq-intermediate.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: pq-intermediate-ca
    volumes:
      - ds-pq-intermediate-data:/data
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.15
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  # 389 Directory Server for PQ IoT CA
  ds-pq-iot:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-pq-iot
    hostname: ds-pq-iot.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: pq-iot-ca
    volumes:
      - ds-pq-iot-data:/data
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.16
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  # Dogtag PQ Root CA - ML-DSA-87 Self-Signed
  # Build from main: ./containers/dogtag-main/build.sh && export PKI_IMAGE=localhost/dogtag-pki-main:latest
  dogtag-pq-root-ca:
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-pq-root-ca
    hostname: pq-root-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-pq-root:
        condition: service_healthy
    environment:
      PKI_DS_URL: ldap://ds-pq-root.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-pq-root-ca
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      HSM_BACKEND: ${HSM_BACKEND:-}
      KRYOPTIC_CONF: /etc/kryoptic/kryoptic.conf
      # ML-DSA-87 specific settings
      PQ_CA_KEY_TYPE: mldsa
      PQ_CA_KEY_ALGORITHM: ML-DSA-87
      PQ_CA_KEY_SIZE: 87
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/pq:/certs
      - pki-pq-root-data:/var/lib/pki
      - pki-pq-root-logs:/var/log/pki
      - kryoptic-pq-data:/var/lib/kryoptic:ro
      - ./containers/kryoptic-hsm/kryoptic.conf:/etc/kryoptic/kryoptic.conf:ro
    extra_hosts:
      - "ds-pq-root.cert-lab.local:172.27.0.14"
      - "ds-pq-intermediate.cert-lab.local:172.27.0.15"
      - "ds-pq-iot.cert-lab.local:172.27.0.16"
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-iot-ca.cert-lab.local:172.27.0.13"
      - "akamu-pq.cert-lab.local:172.27.0.18"
      - "kipuka-pq.cert-lab.local:172.27.0.19"
      - "pq-ocsp.cert-lab.local:172.27.0.22"
      - "ds-pq-ocsp.cert-lab.local:172.27.0.21"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.12
    ports:
      - "8453:8443"
      - "8490:8080"
    command: ["/bin/bash", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ca/admin/ca/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Dogtag PQ Intermediate CA - ML-DSA-87
  dogtag-pq-intermediate-ca:
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-pq-intermediate-ca
    hostname: pq-intermediate-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-pq-intermediate:
        condition: service_healthy
      dogtag-pq-root-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-pq-intermediate.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-pq-intermediate-ca
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      HSM_BACKEND: ${HSM_BACKEND:-}
      KRYOPTIC_CONF: /etc/kryoptic/kryoptic.conf
      # ML-DSA-87 specific settings
      PQ_CA_KEY_TYPE: mldsa
      PQ_CA_KEY_ALGORITHM: ML-DSA-87
      PQ_CA_KEY_SIZE: 87
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/pq:/certs
      - pki-pq-intermediate-data:/var/lib/pki
      - pki-pq-intermediate-logs:/var/log/pki
      - kryoptic-pq-data:/var/lib/kryoptic:ro
      - ./containers/kryoptic-hsm/kryoptic.conf:/etc/kryoptic/kryoptic.conf:ro
    extra_hosts:
      - "ds-pq-root.cert-lab.local:172.27.0.14"
      - "ds-pq-intermediate.cert-lab.local:172.27.0.15"
      - "ds-pq-iot.cert-lab.local:172.27.0.16"
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-iot-ca.cert-lab.local:172.27.0.13"
      - "akamu-pq.cert-lab.local:172.27.0.18"
      - "kipuka-pq.cert-lab.local:172.27.0.19"
      - "pq-ocsp.cert-lab.local:172.27.0.22"
      - "ds-pq-ocsp.cert-lab.local:172.27.0.21"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.11
    ports:
      - "8454:8443"
      - "8484:8080"
    command: ["/bin/bash", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ca/admin/ca/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Dogtag PQ IoT Sub-CA - ML-DSA-87
  dogtag-pq-iot-ca:
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-pq-iot-ca
    hostname: pq-iot-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-pq-iot:
        condition: service_healthy
      dogtag-pq-intermediate-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-pq-iot.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-pq-iot-ca
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      HSM_BACKEND: ${HSM_BACKEND:-}
      KRYOPTIC_CONF: /etc/kryoptic/kryoptic.conf
      # ML-DSA-87 specific settings
      PQ_CA_KEY_TYPE: mldsa
      PQ_CA_KEY_ALGORITHM: ML-DSA-87
      PQ_CA_KEY_SIZE: 87
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/pq:/certs
      - pki-pq-iot-data:/var/lib/pki
      - pki-pq-iot-logs:/var/log/pki
      - kryoptic-pq-data:/var/lib/kryoptic:ro
      - ./containers/kryoptic-hsm/kryoptic.conf:/etc/kryoptic/kryoptic.conf:ro
    extra_hosts:
      - "ds-pq-root.cert-lab.local:172.27.0.14"
      - "ds-pq-intermediate.cert-lab.local:172.27.0.15"
      - "ds-pq-iot.cert-lab.local:172.27.0.16"
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-iot-ca.cert-lab.local:172.27.0.13"
      - "akamu-pq.cert-lab.local:172.27.0.18"
      - "kipuka-pq.cert-lab.local:172.27.0.19"
      - "pq-ocsp.cert-lab.local:172.27.0.22"
      - "ds-pq-ocsp.cert-lab.local:172.27.0.21"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.13
    ports:
      - "8455:8443"
      - "8485:8080"
    command: ["/bin/bash", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ca/admin/ca/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Enrollment Backend: Akamu + Kipuka (--profile akamu) ──────────────────
  # Activate with: ENROLLMENT_BACKEND=akamu (default)
  # Rust-based ACME CA + EST server, delegating to Dogtag PQ Intermediate CA.

  # ── DNS for ACME HTTP-01 validation ────────────────────────────────────────
  # Resolves *.cert-lab.local to the host gateway (172.27.0.1) so akamu can
  # reach certbot's HTTP-01 challenge server running on the host.
  dnsmasq-pq:
    profiles: [akamu]
    image: docker.io/drpsychick/dnsmasq:latest
    container_name: dnsmasq-pq
    hostname: dns-pq.${LAB_DOMAIN:-cert-lab.local}
    command: ["--address=/cert-lab.local/172.27.0.1", "--log-queries", "--no-daemon"]
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.2
    restart: unless-stopped

  # ── Kryoptic HSM (PKCS#11 Software Token) ─────────────────────────────────
  # Provides HSM-backed key storage for kipuka and akamu via p11-kit socket.
  # Client containers mount kryoptic-socket and use p11-kit-client.so.

  kryoptic-pq-hsm:
    profiles: [akamu]
    build:
      context: ./containers/kryoptic-hsm
      dockerfile: Containerfile
    container_name: kryoptic-pq-hsm
    hostname: hsm-pq.${LAB_DOMAIN:-cert-lab.local}
    environment:
      HSM_SO_PIN: ${HSM_SO_PIN:-12345678}
      HSM_USER_PIN: ${HSM_USER_PIN:-1234}
    volumes:
      - kryoptic-pq-data:/var/lib/kryoptic
      - kryoptic-pq-socket:/var/run/kryoptic
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.25
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/kryoptic/status.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  akamu-pq:
    profiles: [akamu]
    image: ${AKAMU_IMAGE:-quay.io/czinda/akamu:latest}
    container_name: akamu-pq
    hostname: akamu-pq.${LAB_DOMAIN:-cert-lab.local}
    depends_on:
      dogtag-pq-intermediate-ca:
        condition: service_healthy
    volumes:
      - ./configs/akamu/pq-config.toml:/app/conf/config.toml:ro,z
      - ./data/certs/pq:/certs:ro,z
      - akamu-pq-data:/app/data
      - kryoptic-pq-socket:/var/run/kryoptic:ro
    extra_hosts:
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-iot-ca.cert-lab.local:172.27.0.13"
      - "akamu-pq.cert-lab.local:172.27.0.18"
      - "kipuka-pq.cert-lab.local:172.27.0.19"
      - "pq-ocsp.cert-lab.local:172.27.0.22"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.18
    ports:
      - "8459:8443"
      - "8486:8080"
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/directory > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  kipuka-pq:
    profiles: [akamu]
    image: ${KIPUKA_IMAGE:-quay.io/czinda/kipuka:latest}
    container_name: kipuka-pq
    hostname: kipuka-pq.${LAB_DOMAIN:-cert-lab.local}
    depends_on:
      dogtag-pq-intermediate-ca:
        condition: service_healthy
    volumes:
      - ./configs/kipuka/pq-config.toml:/etc/kipuka/kipuka.toml:ro
      - ./data/certs/pq:/etc/kipuka/certs:ro
      - kipuka-pq-data:/var/lib/kipuka
      - kryoptic-pq-data:/var/lib/softhsm:ro
      - kryoptic-pq-socket:/var/run/kryoptic:ro
    extra_hosts:
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-iot-ca.cert-lab.local:172.27.0.13"
      - "akamu-pq.cert-lab.local:172.27.0.18"
      - "kipuka-pq.cert-lab.local:172.27.0.19"
      - "pq-ocsp.cert-lab.local:172.27.0.22"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.19
    ports:
      - "8456:9443"
    environment:
      - RUST_LOG=info
      - HSM_USER_PIN=${HSM_USER_PIN:-1234}
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9443/.well-known/est/cacerts 2>/dev/null | head -1 | grep -qE 'BEGIN|MII' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Enrollment Backend: Dogtag EST RA (--profile dogtag-ra) ─────────────────
  # Activate with: ENROLLMENT_BACKEND=dogtag
  # Lightweight Dogtag pki-server instance proxying to PQ Intermediate CA.

  dogtag-pq-est-ca:
    profiles: [dogtag-ra]
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-pq-est-ca
    hostname: pq-est-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      dogtag-pq-intermediate-ca:
        condition: service_started
    environment:
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-pq-est-ca
    volumes:
      - ./scripts/pki:/scripts:ro
      - ./data/certs/pq:/certs
      - pki-pq-est-data:/var/lib/pki
      - pki-pq-est-logs:/var/log/pki
    extra_hosts:
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-iot-ca.cert-lab.local:172.27.0.13"
      - "pq-est-ca.cert-lab.local:172.27.0.18"
      - "pq-ocsp.cert-lab.local:172.27.0.22"
      - "ds-pq-ocsp.cert-lab.local:172.27.0.21"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.18
    ports:
      - "8456:8443"
      - "8486:8080"
    command: ["/bin/bash", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/.well-known/est/cacerts 2>/dev/null | head -1 | grep -qE 'BEGIN|MII' || curl -s http://localhost:8080/.well-known/est/cacerts 2>/dev/null | head -1 | grep -qE 'BEGIN|MII' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 180s

  # 389 Directory Server for PQ OCSP Responder
  ds-pq-ocsp:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-pq-ocsp
    hostname: ds-pq-ocsp.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: pq-ocsp
    volumes:
      - ds-pq-ocsp-data:/data
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.21
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  # Dogtag PQ OCSP Responder - Dedicated OCSP subsystem (ML-DSA-87)
  dogtag-pq-ocsp:
    image: ${PKI_OCSP_IMAGE:-quay.io/dogtagpki/pki-ocsp:latest}
    container_name: dogtag-pq-ocsp
    hostname: pq-ocsp.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-pq-ocsp:
        condition: service_healthy
      dogtag-pq-intermediate-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-pq-ocsp.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-pq-ocsp
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      HSM_BACKEND: ${HSM_BACKEND:-}
      KRYOPTIC_CONF: /etc/kryoptic/kryoptic.conf
      PQ_CA_KEY_TYPE: mldsa
      PQ_CA_KEY_ALGORITHM: ML-DSA-87
      PQ_CA_KEY_SIZE: 87
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/pq:/certs
      - pki-pq-ocsp-data:/var/lib/pki
      - pki-pq-ocsp-logs:/var/log/pki
      - kryoptic-pq-data:/var/lib/kryoptic:ro
      - ./containers/kryoptic-hsm/kryoptic.conf:/etc/kryoptic/kryoptic.conf:ro
    extra_hosts:
      - "ds-pq-root.cert-lab.local:172.27.0.14"
      - "ds-pq-intermediate.cert-lab.local:172.27.0.15"
      - "ds-pq-ocsp.cert-lab.local:172.27.0.21"
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-iot-ca.cert-lab.local:172.27.0.13"
      - "pq-ocsp.cert-lab.local:172.27.0.22"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.22
    ports:
      - "8457:8443"
      - "8492:8080"
    command: ["/bin/bash", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ocsp/admin/ocsp/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  ds-pq-kra:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-pq-kra
    hostname: ds-pq-kra.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: kra
    volumes:
      - ds-pq-kra-data:/data
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.24
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10

  dogtag-pq-kra:
    image: ${PKI_KRA_IMAGE:-quay.io/dogtagpki/pki-kra:latest}
    container_name: dogtag-pq-kra
    hostname: pq-kra.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-pq-kra:
        condition: service_healthy
      dogtag-pq-intermediate-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-pq-kra.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-pq-kra
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      HSM_BACKEND: ${HSM_BACKEND:-}
      KRYOPTIC_CONF: /etc/kryoptic/kryoptic.conf
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/pq:/certs
      - pki-pq-kra-data:/var/lib/pki
      - pki-pq-kra-logs:/var/log/pki
      - kryoptic-pq-data:/var/lib/kryoptic:ro
      - ./containers/kryoptic-hsm/kryoptic.conf:/etc/kryoptic/kryoptic.conf:ro
    extra_hosts:
      - "ds-pq-root.cert-lab.local:172.27.0.14"
      - "ds-pq-intermediate.cert-lab.local:172.27.0.15"
      - "ds-pq-kra.cert-lab.local:172.27.0.24"
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-iot-ca.cert-lab.local:172.27.0.13"
      - "pq-kra.cert-lab.local:172.27.0.23"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.23
    ports:
      - "8458:8443"
      - "8493:8080"
    command: ["/bin/bash", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/kra/admin/kra/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  # 389 Directory Server for PQ Ops CA (RSA-4096, cross-signed by PQ Intermediate)
  # HSM deployment only — activated by HSM_BACKEND=kryoptic
  ds-pq-ops:
    image: quay.io/389ds/dirsrv:${DS_VERSION:-latest}
    container_name: ds-pq-ops
    hostname: ds-pq-ops.${LAB_DOMAIN:-cert-lab.local}
    environment:
      DS_DM_PASSWORD: ${DS_PASSWORD:-RedHat123}
      DS_SUFFIX_NAME: ops-ca
    volumes:
      - ds-pq-ops-data:/data
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.25
    healthcheck:
      test: ["CMD-SHELL", "/usr/libexec/dirsrv/dscontainer -H || ldapsearch -x -H ldap://localhost:3389 -b '' -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 10
    profiles:
      - hsm

  # RSA-4096 Ops CA — issues TLS, admin, subsystem certs for PQ infrastructure.
  # Cross-signed by PQ Intermediate CA. All keys in Kryoptic HSM slot 5.
  # HSM deployment only — activated by HSM_BACKEND=kryoptic
  dogtag-pq-ops-ca:
    image: ${PKI_IMAGE:-quay.io/dogtagpki/pki-ca:latest}
    container_name: dogtag-pq-ops-ca
    hostname: pq-ops-ca.${LAB_DOMAIN:-cert-lab.local}
    privileged: true
    depends_on:
      ds-pq-ops:
        condition: service_healthy
      dogtag-pq-intermediate-ca:
        condition: service_started
    environment:
      PKI_DS_URL: ldap://ds-pq-ops.cert-lab.local:3389
      PKI_DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      PKI_ADMIN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_BACKUP_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_CLIENT_PKCS12_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_TOKEN_PASSWORD: ${PKI_ADMIN_PASSWORD:-RedHat123}
      PKI_INSTANCE_NAME: pki-pq-ops-ca
      DS_PASSWORD: ${DS_PASSWORD:-RedHat123}
      KRYOPTIC_CONF: /etc/kryoptic/kryoptic.conf
    volumes:
      - ./configs/pki:/etc/pki-configs:ro
      - ./scripts/pki:/scripts:ro
      - ./data/certs/pq:/certs
      - pki-pq-ops-data:/var/lib/pki
      - pki-pq-ops-logs:/var/log/pki
      - kryoptic-pq-data:/var/lib/kryoptic:ro
      - ./containers/kryoptic-hsm/kryoptic.conf:/etc/kryoptic/kryoptic.conf:ro
    extra_hosts:
      - "ds-pq-root.cert-lab.local:172.27.0.14"
      - "ds-pq-intermediate.cert-lab.local:172.27.0.15"
      - "ds-pq-ops.cert-lab.local:172.27.0.25"
      - "pq-root-ca.cert-lab.local:172.27.0.12"
      - "pq-intermediate-ca.cert-lab.local:172.27.0.11"
      - "pq-ops-ca.cert-lab.local:172.27.0.26"
    networks:
      pki-pq-net:
        ipv4_address: 172.27.0.26
    ports:
      - "8460:8443"
      - "8494:8080"
    command: ["/bin/bash", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8443/ca/admin/ca/getStatus 2>/dev/null | grep -q running || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles:
      - hsm

networks:
  pki-pq-net:
