# pq-config.toml — Akamu ACME RA for the ML-DSA-87 (Post-Quantum) PKI hierarchy.
#
# Part of the cert-revocation-lab triple PKI infrastructure.
# This instance acts as an ACME Registration Authority — it accepts ACME
# requests but delegates certificate signing to the Dogtag PQ IoT Sub-CA
# via its REST enrollment API. Certificates are in the Dogtag trust chain
# (Root → Intermediate → IoT Sub-CA), so revocation via EDA/Ansible works.
#
# Network: 172.27.0.0/24 (CERT-LAB-PQ)

listen_addr = "0.0.0.0:8080"
base_url    = "http://akamu-pq.cert-lab.local:8080"

[database]
url = "sqlite:///app/data/akamu.db"

[ca]
# No key_file — Dogtag signs all certificates via [ca.signer].
# cert_file holds the IoT Sub-CA chain for AKI derivation and trust anchoring.
cert_file = "/certs/iot-ca-chain.crt"

# CRL and OCSP point to Dogtag's endpoints (akamu's built-in CRL/OCSP
# are disabled for Dogtag-backed CAs since the CA has no local key).
crl_url  = "http://pq-iot-ca.cert-lab.local:8080/ca/ee/ca/getCRL?op=getCRL&crlIssuingPoint=MasterCRL"
ocsp_url = "https://pq-ocsp.cert-lab.local:8443/ocsp/ee/ocsp"

[ca.signer]
type         = "dogtag"
url          = "http://pq-iot-ca.cert-lab.local:8080"
ra_cert_file = "/certs/dogtag/agent.pem"
ra_key_file  = "/certs/dogtag/agent-rsa.key.pem"
ca_cert_file = "/certs/dogtag/ca-chain.pem"
profile_id   = "caServerCert"
timeout_secs = 30

[server]
http_validation_allow_private_ips = true
http_validation_port = 80
validate_dnssec = false

[profiles]
refresh_interval_secs = 3600

[profiles.providers.dogtag]
type        = "dogtag"
profile_dir = "/certs/profiles"
profiles    = []
