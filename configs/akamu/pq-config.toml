# pq-config.toml — Akamu ACME RA for the ML-DSA-87 (Post-Quantum) PKI hierarchy.
#
# Dogtag RA mode: Akamu validates ACME requests and forwards CSRs to
# the Dogtag PQ IoT Sub-CA for signing. The CA key never resides on
# the Akamu host. CRL and OCSP are served by Dogtag.
#
# Reference: https://akamu.dev/doc/user/configuration.html#casigner
#
# Network: 172.27.0.0/24 (CERT-LAB-PQ)

listen_addr = "0.0.0.0:8080"

# base_url is embedded in every URL returned to ACME clients (directory,
# account, order, certificate URLs). Must match what clients use to reach
# the server. For the lab, clients run on the host where port 8486 maps
# to container port 8080.
base_url = "http://akamu-pq.cert-lab.local:8486"

[database]
url = "sqlite:///app/data/akamu.db"

[ca]
# RA mode: key_file is omitted — Dogtag signs all certificates.
# cert_file points to the Dogtag CA certificate chain (used for
# chain building and AKI computation per the docs).
cert_file = "/certs/iot-ca-chain.crt"

# CRL and OCSP point to Dogtag's endpoints (akamu's built-in
# CRL/OCSP return 404 in RA mode — this is expected).
crl_url  = "http://pq-iot-ca.cert-lab.local:8080/ca/ee/ca/getCRL?op=getCRL&crlIssuingPoint=MasterCRL"
ocsp_url = "http://pq-ocsp.cert-lab.local:8080/ocsp/ee/ocsp"

[ca.signer]
type         = "dogtag"
# HTTP for PQ: Dogtag's HTTPS connector requires client cert auth
# from external connections. HTTP with basic auth works reliably.
url          = "http://pq-iot-ca.cert-lab.local:8080"
ra_cert_file = "/dev/null"
ra_key_file  = "/dev/null"
ca_cert_file = "/certs/dogtag/ca-chain.pem"
profile_id   = "caServerCert"
timeout_secs = 30
username     = "caadmin"
password     = "RedHat123"

[server]
http_validation_allow_private_ips = true
http_validation_port = 80
validate_dnssec = false
dns_resolver_addr = "172.27.0.2:53"

[profiles]
refresh_interval_secs = 3600

[star]
# RFC 8739 — Short-Term Automatic Renewal
# Akamu auto-renews STAR certificates before expiry; clients fetch
# a rolling URL that always returns a fresh cert.
enabled = true
min_lifetime_secs = 3600        # 1 hour minimum cert lifetime
max_duration_secs = 604800      # 7 day max subscription duration
allow_certificate_get = true    # allow unauthenticated GET on star cert URL
