# pq-config.toml — Akamu ACME CA for the ML-DSA-87 (Post-Quantum) PKI hierarchy.
#
# Part of the cert-revocation-lab triple PKI infrastructure.
# This instance serves the post-quantum hierarchy using ML-DSA-87
# (NIST FIPS 204 Level 5) for CA signing. The upstream Dogtag image
# (11.10.0, JSS 5.10.0, NSS 3.123.1) provides ML-DSA-87 support.

listen_addr = "0.0.0.0:8080"
base_url    = "https://akamu-pq.cert-lab.local:8443"

[database]
url = "sqlite:///app/data/akamu.db"

[ca]
# PQ uses ML-DSA-87 for CA signing (all certs in this hierarchy are ML-DSA-87).
key_file  = "/certs/akamu-pq.key.pem"
cert_file = "/certs/akamu-pq.cert.pem"

[profiles]
refresh_interval_secs = 3600

[profiles.providers.dogtag]
type        = "dogtag"
profile_dir = "/certs/profiles"
profiles    = []
