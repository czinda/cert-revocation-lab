# rsa-config.toml — Akamu ACME RA for the RSA-4096 PKI hierarchy.
#
# Dogtag RA mode: delegates signing to the Dogtag RSA IoT Sub-CA.
# Reference: https://akamu.dev/doc/user/configuration.html#casigner

listen_addr = "0.0.0.0:8483"
base_url    = "http://akamu-rsa.cert-lab.local:8483"

[database]
url = "sqlite:///app/data/akamu.db"

[ca]
cert_file = "/certs/iot-ca-chain.crt"
crl_url   = "https://iot-ca.cert-lab.local:8443/ca/ee/ca/getCRL?op=getCRL&crlIssuingPoint=MasterCRL"
ocsp_url  = "https://ocsp.cert-lab.local:8443/ocsp/ee/ocsp"

[ca.signer]
type         = "dogtag"
url          = "https://iot-ca.cert-lab.local:8443"
ra_cert_file = "/certs/dogtag/agent.pem"
ra_key_file  = "/certs/dogtag/agent-rsa.key.pem"
ca_cert_file = "/certs/dogtag/ca-chain.pem"
profile_id   = "acmeServerCert"
timeout_secs = 30

[server]
http_validation_allow_private_ips = true
http_validation_port = 8880
validate_dnssec = false
# dnsmasq-rsa (172.26.0.2) resolves *.cert-lab.local → 172.26.0.1 (gateway = host)
# so akamu can reach the HTTP-01 challenge server running on the host.
dns_resolver_addr = "172.26.0.2:53"
eab_master_secret = "Y2VydC1sYWItZWFiLW1hc3Rlci1zZWNyZXQtMzJieXRlcyE"

# ── GSSAPI / Kerberos for EAB endpoint ──────────────────────────────────
# Enables Authorization: Negotiate on GET /acme/eab.
# Requires a keytab for HTTP/akamu-rsa.cert-lab.local from FreeIPA.
[server.gssapi]
keytab_file = "/etc/krb5.keytab"
service_name = "HTTP"

[profiles]
refresh_interval_secs = 3600

# ── EAB / Kerberos Binding ───────────────────────────────────────────────
# EAB credentials are derived from Kerberos principals via HKDF-SHA256.
# GET /acme/eab with Authorization: Negotiate returns (kid, hmac_key).
# To enforce EAB on all accounts, set external_account_required = true
# in the ACME directory meta (akamu config, not here).

[star]
# RFC 8739 — Short-Term Automatic Renewal
enabled = true
min_lifetime_secs = 3600
max_duration_secs = 604800
allow_certificate_get = true
