# rsa-config.toml — Akamu ACME CA for the RSA-4096 PKI hierarchy.
#
# Part of the cert-revocation-lab triple PKI infrastructure.
# This instance serves the RSA-4096 hierarchy (SHA-512 signatures),
# using Dogtag PKI profiles from the filesystem.

listen_addr = "0.0.0.0:8080"
base_url    = "https://akamu-rsa.cert-lab.local:8443"

[database]
url = "sqlite:///app/data/akamu.db"

[ca]
key_file  = "/certs/akamu-rsa.key.pem"
cert_file = "/certs/akamu-rsa.cert.pem"

[profiles]
refresh_interval_secs = 3600

[profiles.providers.dogtag]
type        = "dogtag"
profile_dir = "/certs/profiles"
profiles    = []
