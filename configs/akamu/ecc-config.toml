# ecc-config.toml — Akamu ACME RA for the ECC P-384 PKI hierarchy.
#
# Dogtag RA mode: delegates signing to the Dogtag ECC IoT Sub-CA.
# Reference: https://akamu.dev/doc/user/configuration.html#casigner

listen_addr = "0.0.0.0:8080"
base_url    = "http://akamu-ecc.cert-lab.local:8496"

[database]
url = "sqlite:///app/data/akamu.db"

[ca]
cert_file = "/certs/iot-ca-chain.crt"
crl_url   = "https://ecc-iot-ca.cert-lab.local:8443/ca/ee/ca/getCRL?op=getCRL&crlIssuingPoint=MasterCRL"
ocsp_url  = "https://ecc-ocsp.cert-lab.local:8443/ocsp/ee/ocsp"

[ca.signer]
type         = "dogtag"
url          = "https://ecc-iot-ca.cert-lab.local:8443"
ra_cert_file = "/certs/dogtag/agent.pem"
ra_key_file  = "/certs/dogtag/agent-rsa.key.pem"
ca_cert_file = "/certs/dogtag/ca-chain.pem"
profile_id   = "caECServerCert"
timeout_secs = 30

[server]
http_validation_allow_private_ips = true
http_validation_port = 80
validate_dnssec = false

[profiles]
refresh_interval_secs = 3600

[star]
# RFC 8739 — Short-Term Automatic Renewal
enabled = true
min_lifetime_secs = 3600
max_duration_secs = 604800
allow_certificate_get = true
