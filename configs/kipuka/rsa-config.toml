# ── Kipuka EST Server — RSA-4096 PKI Hierarchy ─────────────────────────
#
# Configuration for the RSA-4096 certificate revocation lab.
# Proxies EST enrollment requests to the Dogtag IoT Sub-CA (issuing CA)
# (iot-ca.cert-lab.local) using the caServerCert profile.
#
# Network: 172.26.0.0/24 (CERT-LAB)
# Certificates: data/certs/rsa/
# ────────────────────────────────────────────────────────────────────────

# ── Server ───────────────────────────────────────────────────────────────
[server]
listen_addr = "0.0.0.0:9443"

# ── TLS ──────────────────────────────────────────────────────────────────
[tls]
enabled   = true
cert_file = "/etc/kipuka/certs/kipuka-rsa.cert.pem"
key_file  = "/etc/kipuka/certs/kipuka-rsa.key.pem"
ca_file   = "/etc/kipuka/certs/iot-ca-chain.crt"

# Accept but don't require client certificates — enrollment can fall
# back to OTP authentication via HTTP Basic.
client_auth = "optional"

# ── CA Key Material ──────────────────────────────────────────────────────
# Required by the config parser even in Dogtag proxy mode. Points to the
# kipuka TLS cert/key — actual certificate signing is done by Dogtag.
[ca]
key_file  = "/etc/kipuka/certs/kipuka-rsa.key.pem"
cert_file = "/etc/kipuka/certs/iot-ca-chain.crt"

# ── Database ─────────────────────────────────────────────────────────────
[database]
url = "sqlite:///var/lib/kipuka/kipuka.db?mode=rwc"

# ── Dogtag PKI Backend ──────────────────────────────────────────────────
# Proxy enrollment to the RSA IoT Sub-CA (issuing CA) via Dogtag REST API.
# The IoT Sub-CA is the leaf-issuing tier — the Intermediate CA only signs
# sub-CA certificates.
[dogtag]
ca_url         = "https://iot-ca.cert-lab.local:8443"
kra_url        = "https://kra.cert-lab.local:8443"
agent_cert_file = "/etc/kipuka/certs/dogtag/agent.pem"
agent_key_file  = "/etc/kipuka/certs/dogtag/agent-rsa.key.pem"
ca_cert_file    = "/etc/kipuka/certs/dogtag/ca-chain.pem"
profile_id      = "caServerCert"
accept_invalid_certs = true

# ── EST Protocol ─────────────────────────────────────────────────────────
[est]
simpleenroll   = true
simplereenroll = true
csrattrs       = true
fullcmc        = false
serverkeygen   = true

# ── OTP Enrollment Authentication ────────────────────────────────────────
[otp]
enabled         = true
storage_backend = "db"
entropy_bits    = 128
ttl_seconds     = 3600
max_usage       = 1

# ── Admin API ────────────────────────────────────────────────────────────
# Enables OTP management, health checks, and certificate listing.
# Bearer token auth — simple shared secret for lab use.
[admin]
enabled      = true
auth_method  = "basic"
bearer_token = "cert-lab-kipuka-admin-token"

# ── GSSAPI / Kerberos Authentication ────────────────────────────────────
# Enables EST enrollment via Kerberos (SPNEGO). Clients authenticate
# with a Kerberos ticket; kipuka validates against the keytab.
# Requires kipuka built with --features gssapi and FreeIPA running.
# Uncomment after FreeIPA keytab is provisioned:
#   ipa service-add HTTP/kipuka-rsa.cert-lab.local
#   ipa-getkeytab -s ipa.cert-lab.local -p HTTP/kipuka-rsa.cert-lab.local -k /path/to/kipuka.keytab
# [admin.gssapi]
# keytab_file = "/etc/krb5.keytab"
# require_crypto_verification = true

# ── Audit ────────────────────────────────────────────────────────────────
[audit]
enabled    = true
log_path   = "/dev/stdout"
log_to_db  = true
