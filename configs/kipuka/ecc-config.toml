# ── Kipuka EST Server — ECC P-384 PKI Hierarchy ────────────────────────
#
# Configuration for the ECC P-384 certificate revocation lab.
# Proxies EST enrollment requests to the Dogtag ECC IoT Sub-CA (issuing CA)
# (ecc-iot-ca.cert-lab.local) using the caECServerCert profile.
#
# Network: 172.28.0.0/24 (CERT-LAB-ECC)
# Certificates: data/certs/ecc/
# ────────────────────────────────────────────────────────────────────────

# ── Server ───────────────────────────────────────────────────────────────
[server]
listen_addr = "0.0.0.0:9443"

# ── TLS ──────────────────────────────────────────────────────────────────
[tls]
enabled   = true
cert_file = "/etc/kipuka/certs/kipuka-ecc.cert.pem"
key_file  = "/etc/kipuka/certs/kipuka-ecc.key.pem"
ca_file   = "/etc/kipuka/certs/ca-chain.crt"

# Accept but don't require client certificates — enrollment can fall
# back to OTP authentication via HTTP Basic.
client_auth = "optional"

# ── Database ─────────────────────────────────────────────────────────────
[database]
url = "sqlite:///var/lib/kipuka/kipuka.db?mode=rwc"

# ── Dogtag PKI Backend ──────────────────────────────────────────────────
# Proxy enrollment to the ECC IoT Sub-CA (issuing CA) via Dogtag REST API.
# The IoT Sub-CA is the leaf-issuing tier — the Intermediate CA only signs
# sub-CA certificates.
[dogtag]
ca_url         = "https://ecc-iot-ca.cert-lab.local:8443"
agent_cert_file = "/etc/kipuka/dogtag/agent.pem"
agent_key_file  = "/etc/kipuka/dogtag/agent-key.pem"
ca_cert_file    = "/etc/kipuka/dogtag/ca-chain.pem"
profile_id      = "caECServerCert"

# ── EST Protocol ─────────────────────────────────────────────────────────
[est]
simpleenroll   = true
simplereenroll = true
csrattrs       = true
fullcmc        = false
serverkeygen   = false

# ── OTP Enrollment Authentication ────────────────────────────────────────
[otp]
enabled         = true
storage_backend = "db"
entropy_bits    = 128
ttl_seconds     = 3600
max_usage       = 1

# ── Audit ────────────────────────────────────────────────────────────────
[audit]
enabled    = true
log_path   = "/dev/stdout"
log_to_db  = true
