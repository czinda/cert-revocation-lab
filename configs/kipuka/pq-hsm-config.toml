# ── Kipuka EST Server — Kryoptic HSM Deployment ────────────────────────
#
# HSM variant: TLS and agent keys backed by Kryoptic PKCS#11 module.
# Private keys never leave the HSM boundary.
#
# Use: HSM_BACKEND=kryoptic selects this config over pq-config.toml
# Network: 172.27.0.0/24 (CERT-LAB-PQ)
# ────────────────────────────────────────────────────────────────────────

# ── Server ───────────────────────────────────────────────────────────────
[server]
listen_addr = "0.0.0.0:9443"

# ── TLS ──────────────────────────────────────────────────────────────────
[tls]
enabled   = true
cert_file = "/etc/kipuka/certs/kipuka-pq.cert.pem"
key_file  = "/etc/kipuka/certs/kipuka-pq.key.pem"
ca_file   = "/etc/kipuka/certs/dogtag/ca-chain.pem"
client_auth = "optional"

# ── CA Key Material ──────────────────────────────────────────────────────
[ca]
key_file   = "/etc/kipuka/certs/kipuka-pq.key.pem"
cert_file  = "/etc/kipuka/certs/ca-chain.crt"

# ── HSM / PKCS#11 (Kryoptic) ────────────────────────────────────────────
# Kryoptic native module with PQC support. Token volume shared from
# kryoptic-pq-hsm container. Keys generated by pkispawn or pkcs11-tool.
[hsm]
provider     = "kryoptic"
library_path = "/var/lib/kryoptic/libkryoptic_pkcs11.so"
pin          = "env:HSM_USER_PIN"
token_label  = "Kipuka EST"

# ── Database ─────────────────────────────────────────────────────────────
[database]
url = "sqlite:///var/lib/kipuka/kipuka.db?mode=rwc"

# ── Dogtag PKI Backend ───────────────────────────────────────────────────
[dogtag]
# HTTPS with basic auth (no mTLS): Dogtag's NSS can't validate
# ML-DSA-87-signed agent cert chains during TLS client authentication.
# skip_mtls=true tells kipuka to connect via HTTPS but NOT present
# the agent certificate — basic auth handles all REST API authorization.
ca_url          = "https://pq-iot-ca.cert-lab.local:8443"
kra_url         = "https://pq-kra.cert-lab.local:8443"
agent_cert_file = "/etc/kipuka/certs/dogtag/agent.pem"
agent_key_file  = "/etc/kipuka/certs/dogtag/agent-rsa.key.pem"
ca_cert_file    = "/etc/kipuka/certs/dogtag/ca-chain.pem"
profile_id      = "labMLDSAServerCert"
username        = "caadmin"
password        = "RedHat123"
kra_username    = "kraadmin"
kra_password    = "RedHat123"
skip_mtls       = true

# ── EST Protocol ─────────────────────────────────────────────────────────
[est]
simpleenroll   = true
simplereenroll = true
csrattrs       = true
fullcmc        = false
serverkeygen   = false

# ── OTP Enrollment Authentication ────────────────────────────────────────
[otp]
enabled         = true
storage_backend = "db"
entropy_bits    = 128
ttl_seconds     = 3600
max_usage       = 1

# ── Admin API ────────────────────────────────────────────────────────────
[admin]
enabled      = true
auth_method  = "basic"
bearer_token = "cert-lab-kipuka-admin-token"

# ── Audit ────────────────────────────────────────────────────────────────
[audit]
enabled    = true
log_path   = "/var/lib/kipuka/audit.log"
log_to_db  = true
