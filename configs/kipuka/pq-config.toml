# ── Kipuka EST Server — ML-DSA-87 Post-Quantum PKI Hierarchy ───────────
#
# Configuration for the ML-DSA-87 (NIST FIPS 204) certificate revocation lab.
# Proxies EST enrollment requests to the Dogtag PQ Intermediate CA
# (pq-intermediate-ca.cert-lab.local) using the caServerCert profile.
#
# IMPORTANT: Uses HTTP (port 8080), not HTTPS. NSS 3.123.1 cannot validate
# ML-DSA-87 certificate chains in the client TLS authentication path.
# Server-side TLS works with the JDK handshake size fix
# (-Djdk.tls.maxHandshakeMessageSize=64000) but the pki CLI and REST
# clients must use HTTP with basic auth for CSR signing and approval.
#
# The profile is caServerCert (not caMLDSAServerCert) because OpenSSL
# cannot generate ML-DSA CSRs — the CA generates ML-DSA keys server-side.
#
# Network: 172.27.0.0/24 (CERT-LAB-PQ)
# Certificates: data/certs/pq/
# ────────────────────────────────────────────────────────────────────────

# ── Server ───────────────────────────────────────────────────────────────
[server]
listen_addr = "0.0.0.0:9443"

# ── TLS ──────────────────────────────────────────────────────────────────
[tls]
enabled   = true
cert_file = "/etc/kipuka/certs/kipuka-pq.cert.pem"
key_file  = "/etc/kipuka/certs/kipuka-pq.key.pem"
ca_file   = "/etc/kipuka/certs/ca-chain.crt"

# Accept but don't require client certificates — enrollment can fall
# back to OTP authentication via HTTP Basic.
client_auth = "optional"

# ── Database ─────────────────────────────────────────────────────────────
[database]
url = "sqlite:///var/lib/kipuka/kipuka.db?mode=rwc"

# ── Dogtag PKI Backend ──────────────────────────────────────────────────
# Proxy enrollment to the PQ Intermediate CA via Dogtag REST API.
# The kipuka-dogtag crate connects to Dogtag CA for certificate issuance,
# renewal, and revocation instead of using a local signing key.
#
# NOTE: HTTP on port 8080 is required for the PQ hierarchy. NSS cannot
# validate ML-DSA-87 cert chains in TLS client auth, so the Dogtag REST
# API must be accessed over plaintext HTTP. The web.xml CONFIDENTIAL
# transport-guarantee is patched to NONE during PQ CA initialization.
[dogtag]
ca_url         = "http://pq-intermediate-ca.cert-lab.local:8080"
agent_cert_file = "/etc/kipuka/dogtag/agent.pem"
agent_key_file  = "/etc/kipuka/dogtag/agent-key.pem"
ca_cert_file    = "/etc/kipuka/dogtag/ca-chain.pem"
profile_id      = "caServerCert"

# ── EST Protocol ─────────────────────────────────────────────────────────
[est]
simpleenroll   = true
simplereenroll = true
csrattrs       = true
fullcmc        = false
serverkeygen   = false

# ── OTP Enrollment Authentication ────────────────────────────────────────
[otp]
enabled         = true
storage_backend = "db"
entropy_bits    = 128
ttl_seconds     = 3600
max_usage       = 1

# ── Audit ────────────────────────────────────────────────────────────────
[audit]
enabled    = true
log_path   = "/dev/stdout"
log_to_db  = true
