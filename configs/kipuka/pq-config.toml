# ── Kipuka EST Server — ML-DSA-87 Post-Quantum PKI Hierarchy ───────────
#
# All operational keys (TLS server, Dogtag agent) are stored in SoftHSM2
# via PKCS#11 — private keys never leave the HSM boundary.
#
# Network: 172.27.0.0/24 (CERT-LAB-PQ)
# ────────────────────────────────────────────────────────────────────────

# ── Server ───────────────────────────────────────────────────────────────
[server]
listen_addr = "0.0.0.0:9443"

# ── TLS ──────────────────────────────────────────────────────────────────
[tls]
enabled   = true
cert_file = "/etc/kipuka/certs/kipuka-pq.cert.pem"
key_file  = "/etc/kipuka/certs/kipuka-pq.key.pem"
ca_file   = "/etc/kipuka/certs/dogtag/ca-chain.pem"
client_auth = "optional"

# ── CA Key Material ──────────────────────────────────────────────────────
[ca]
key_file   = "/etc/kipuka/certs/kipuka-pq.cert.pem"
cert_file  = "/etc/kipuka/certs/kipuka-pq.cert.pem"

# ── HSM / PKCS#11 (SoftHSM2) ────────────────────────────────────────────
# SoftHSM2 module loaded directly (shared token volume from kryoptic-pq-hsm).
# ── HSM (optional — uncomment to use PKCS#11 for TLS key) ────────────────
# Requires libsofthsm2.so mounted into the container and token provisioned.
# [hsm]
# provider     = "kryoptic"
# library_path = "/usr/lib64/pkcs11/libsofthsm2.so"
# pin          = "env:HSM_USER_PIN"
# token_label  = "pq-kipuka-tls"

# ── Database ─────────────────────────────────────────────────────────────
[database]
url = "sqlite:///var/lib/kipuka/kipuka.db?mode=rwc"

# ── Dogtag PKI Backend ───────────────────────────────────────────────────
[dogtag]
# HTTP with basic auth: Dogtag's HTTPS agent endpoints (/ca/rest/agent/*)
# require certificate-based auth via client cert mapped to the agent group.
# The mTLS client cert (RSA key, ML-DSA-87 issuer) is rejected because
# Dogtag's NSS/JSSE can't validate the ML-DSA issuer chain during TLS
# client cert verification (NSS lacks ML-DSA TLS SignatureScheme support).
# HTTP port 8080 accepts basic auth for ALL endpoints including agent
# approve, which is required for kipuka's auto-approve flow.
ca_url          = "http://pq-iot-ca.cert-lab.local:8080"
kra_url         = "http://pq-kra.cert-lab.local:8080"
agent_cert_file = "/etc/kipuka/certs/dogtag/agent.pem"
agent_key_file  = "/etc/kipuka/certs/dogtag/agent-rsa.key.pem"
ca_cert_file    = "/etc/kipuka/certs/dogtag/ca-chain.pem"
profile_id      = "acmeServerCert"
username        = "caadmin"
password        = "RedHat123"

# ── EST Protocol ─────────────────────────────────────────────────────────
[est]
simpleenroll   = true
simplereenroll = true
csrattrs       = true
fullcmc        = false
serverkeygen   = false

# ── OTP Enrollment Authentication ────────────────────────────────────────
[otp]
enabled         = true
storage_backend = "db"
entropy_bits    = 128
ttl_seconds     = 3600
max_usage       = 1

# ── Admin API ────────────────────────────────────────────────────────────
[admin]
enabled      = true
auth_method  = "basic"
bearer_token = "cert-lab-kipuka-admin-token"

# ── Audit ────────────────────────────────────────────────────────────────
[audit]
enabled    = true
log_path   = "/var/lib/kipuka/audit.log"
log_to_db  = true
