# Kerberos configuration for cert-revocation-lab
# Realm: CERT-LAB.LOCAL   KDC: FreeIPA at ipa.cert-lab.local
#
# FreeIPA maps port 88 → 8800 on the host. Containers on pki-*-net
# reach the KDC via the host gateway (172.x.0.1:8800).

[libdefaults]
    default_realm = CERT-LAB.LOCAL
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    forwardable = true
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    CERT-LAB.LOCAL = {
        kdc = ipa.cert-lab.local:8800
        admin_server = ipa.cert-lab.local:4640
    }

[domain_realm]
    .cert-lab.local = CERT-LAB.LOCAL
    cert-lab.local = CERT-LAB.LOCAL
