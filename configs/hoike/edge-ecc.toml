# ── Hoike Edge Node — ECC P-384 PKI Hierarchy ─────────────────────────
#
# Edge mode: keyless, serves pre-signed bundles.
# ───────────────────────────────────────────────────────────────────────

[server]
mode    = "edge"
listen  = "0.0.0.0:2560"

[storage]
bundle_dir = "/var/lib/hoike/bundles"
state_db   = "/var/lib/hoike/state"

[gossip]
enabled   = true
bind      = "0.0.0.0:7946"
seeds     = ["172.28.0.30:7946", "172.28.0.32:7946"]
node_name = "hoike-ecc-edge-1"

[[ca]]
label        = "ecc-iot"
nonce_policy = "forward"
forward_to   = "http://ecc-ocsp.cert-lab.local:8080/ocsp"
