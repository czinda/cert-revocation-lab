# ── Hoike OCSP Signer — ML-DSA-87 PKI Hierarchy ─────────────────────────
#
# Template for the assembled deployment config. scripts/hoike/
# assemble-signer-config.py merges this with the generated issuer identity
# (configs/hoike/ca-identity.toml) into
# /run/cert-revocation-lab/hoike-pq-signer.toml, which is what the compose
# file mounts — hoike's dogtag-sync source has no issuer-cert fallback, so
# the identity bytes must be present for CertID computation.
#
# Network: 172.27.0.0/24 (CERT-LAB-PQ pki-pq-net)
# ───────────────────────────────────────────────────────────────────────

[server]
mode    = "signer"
listen  = "0.0.0.0:2560"

[storage]
bundle_dir = "/var/lib/hoike/bundles"
state_db   = "/var/lib/hoike/state"
seal_signer_pins = ["/certs/hoike-seal-cert.pem"]

[gossip]
auth_mode = "permissive"  # lab fleet: no per-node gossip identity keys; bundles stay CMS-seal authenticated
enabled   = true
bind      = "0.0.0.0:7946"
seeds     = ["172.27.0.31:7946", "172.27.0.32:7946"]
node_name = "hoike-pq-signer"

[[ca]]
label          = "pq-iot"
batch_interval = 30
validity_secs  = 86400
sig_alg        = "ecdsa-p256"
nonce_policy   = "live"
responder_cert = "/certs/hoike-ocsp-signing.pem"
seal_key    = "/certs/hoike-seal-key.pem"
seal_cert   = "/certs/hoike-seal-cert.pem"

[ca.source]
type              = "dogtag-sync"
ldap_url          = "ldap://ds-pq-iot.cert-lab.local:3389"
base_dn           = "ou=certificateRepository,ou=ca,o=pki-pq-iot-ca-CA"
bind_dn           = "cn=Directory Manager"
bind_password_env = "HOIKE_LDAP_BIND_PASSWORD"
cookie_path       = "/var/lib/hoike/state/sync-cookie.dat"

[ca.signing_key]
type        = "pkcs11"
module      = "/usr/lib64/pkcs11/libsofthsm2.so"
token_label = "hoike-ocsp"
key_label   = "ocsp-signing"
pin_env     = "HOIKE_HSM_PIN"
