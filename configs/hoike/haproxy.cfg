# hoike load balancer.
#
# Health checking an OCSP responder is subtle: the protocol answers HTTP 200
# for *every* outcome including `unauthorized`, so "returns 200" does not mean
# "has a working bundle". A node that lost its bundle would still pass a naive
# check while answering unauthorized to every client.
#
# So the check posts a real OCSPRequest for a serial known to be in the bundle
# and requires a successful response body. Byte 2 of a DER OCSPResponse is the
# responseStatus ENUMERATED: 0x00 = successful, 0x06 = unauthorized.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode                http
    log                 global
    option              httplog
    timeout connect     5s
    timeout client      30s
    timeout server      30s
    retries             2

frontend ocsp_in
    bind *:8080
    default_backend hoike_edges

backend hoike_edges
    balance roundrobin
    option httpchk
    http-check send meth POST uri / hdr Content-Type application/ocsp-request
    # binary-safe: expect the successful(0) responseStatus prefix
    http-check expect rstatus 200

    # `observe layer7` + `error-limit` sheds a node that starts answering
    # unauthorized in bulk, which is the realistic bundle-expiry failure.
    default-server observe layer7 error-limit 10 on-error mark-down inter 5s fall 3 rise 2

    server edge1 hoike-edge-1:2560 check
    server edge2 hoike-edge-2:2560 check
    server edge3 hoike-edge-3:2560 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
