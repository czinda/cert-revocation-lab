# ── Hoike Edge Node — ML-DSA-87 PKI Hierarchy ─────────────────────────
#
# Edge mode: keyless, serves pre-signed bundles.
# ───────────────────────────────────────────────────────────────────────

[server]
mode    = "edge"
listen  = "0.0.0.0:2560"

[storage]
bundle_dir = "/var/lib/hoike/bundles"
state_db   = "/var/lib/hoike/state"
seal_signer_pins = ["/certs/hoike-seal-cert.pem"]

[gossip]
auth_mode = "permissive"  # lab fleet: no per-node gossip identity keys; bundles stay CMS-seal authenticated
enabled   = true
bind      = "0.0.0.0:7946"
seeds     = ["172.27.0.30:7946", "172.27.0.32:7946"]
node_name = "hoike-pq-edge-1"

[[ca]]
label           = "pq-iot"
nonce_policy    = "forward"
completeness   = "authoritative-complete"  # matches the signer-produced bundle
forward_to      = "http://hoike-pq.cert-lab.local:2560"
forward_insecure = true
