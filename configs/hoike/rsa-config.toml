# ── Hoike OCSP Signer — RSA-4096 PKI Hierarchy ──────────────────────────
#
# Template for the assembled deployment config. scripts/hoike/
# assemble-signer-config.py merges this with the generated issuer identity
# (configs/hoike/ca-identity.toml) into
# /run/cert-revocation-lab/hoike-rsa-signer.toml, which is what the compose
# file mounts.
#
# Network: 172.26.0.0/24 (CERT-LAB pki-net)
# ───────────────────────────────────────────────────────────────────────

[server]
mode    = "signer"
listen  = "0.0.0.0:2560"

[storage]
bundle_dir = "/var/lib/hoike/bundles"
state_db   = "/var/lib/hoike/state"

[gossip]
enabled   = true
bind      = "0.0.0.0:7946"
seeds     = ["172.26.0.31:7946", "172.26.0.32:7946"]
node_name = "hoike-rsa-signer"

[[ca]]
label          = "rsa-iot"
batch_interval = 30
validity_secs  = 86400
sig_alg        = "ecdsa-p256"
nonce_policy   = "live"
responder_cert = "/certs/hoike-ocsp-signing.pem"

[ca.source]
type              = "dogtag-sync"
ldap_url          = "ldap://ds-iot.cert-lab.local:3389"
base_dn           = "ou=certificateRepository,ou=ca,o=pki-iot-ca-CA"
bind_dn           = "cn=Directory Manager"
bind_password_env = "HOIKE_LDAP_BIND_PASSWORD"
cookie_path       = "/var/lib/hoike/state/sync-cookie.dat"

[ca.signing_key]
type        = "pkcs11"
module      = "/usr/lib64/pkcs11/libsofthsm2.so"
token_label = "hoike-ocsp"
key_label   = "ocsp-signing"
pin_env     = "HOIKE_HSM_PIN"
