# ── Hoike OCSP Responder — RSA-4096 PKI Hierarchy ──────────────────────
#
# Combined mode: signer tier (batch-signs responses from CRL) and edge
# tier (serves pre-signed bundles) in a single process.
#
# Signing key lives in SoftHSM2 (PKCS#11) inside the container.
# CRL is fetched from the Dogtag IoT Sub-CA via the CDP server.
#
# Network: 172.26.0.0/24 (CERT-LAB pki-net)
# ────────────────────────────────────────────────────────────────────────

[server]
mode    = "combined"
listen  = "0.0.0.0:2560"

[storage]
bundle_dir = "/var/lib/hoike/bundles"
state_db   = "/var/lib/hoike/state"

[[ca]]
label          = "rsa-iot"
batch_interval = 300
validity_secs  = 86400
nonce_policy   = "ignore"

[ca.source]
type = "crl"
path = "/var/lib/hoike/crl/rsa-iot.crl"

[ca.signing_key]
type        = "pkcs11"
module      = "/usr/lib64/pkcs11/libsofthsm2.so"
token_label = "hoike-ocsp"
key_label   = "ocsp-signing"
pin_env     = "HOIKE_HSM_PIN"
