# Kryoptic PKCS#11 token configuration for hoike OCSP signers
#
# Each hierarchy gets its own slot with a dedicated OCSP signing keypair.
# Token files are SQLite databases in /var/lib/kryoptic/tokens/

[[slots]]
slot = 0
description = "RSA OCSP Responder"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/hoike-rsa-ocsp.sql"

[[slots]]
slot = 1
description = "ECC OCSP Responder"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/hoike-ecc-ocsp.sql"

[[slots]]
slot = 2
description = "PQ OCSP Responder"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/hoike-pq-ocsp.sql"
