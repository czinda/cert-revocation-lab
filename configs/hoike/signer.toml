# hoike signer — produces sealed generations for all nine lab CAs.
#
# CA blocks live in ca-identity.toml, generated by gen-ca-identity.py from the
# actual CA certificates. Regenerate after any CA is reissued: issuerKeyHash
# changes and every CertID in the bundle changes with it.

[server]
mode        = "signer"
listen      = "0.0.0.0:2560"
max_request = 8192

[storage]
bundle_dir = "/var/lib/hoike/bundles"
state_db   = "/var/lib/hoike/state"
max_chain  = 24

[gossip]
enabled = true
bind    = "0.0.0.0:7946"
seeds   = ["hoike-edge-1:7946", "hoike-edge-2:7946", "hoike-edge-3:7946"]

# NOTE: gossip messages are NOT signed in the current implementation.
# Acceptable inside the lab bridge network; not acceptable on a real fleet.
# Tracked as hoike Known Limitation "gossip authentication".

include = "/etc/hoike/ca-identity.toml"
