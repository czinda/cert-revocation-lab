global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend ocsp_pq
    bind *:2560
    default_backend hoike_pq

backend hoike_pq
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server edge-1  172.27.0.31:2560 check inter 5s fall 3 rise 2
    server edge-2  172.27.0.32:2560 check inter 5s fall 3 rise 2
    server signer  172.27.0.30:2560 check inter 5s fall 3 rise 2 backup
