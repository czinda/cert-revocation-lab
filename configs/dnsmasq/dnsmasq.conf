# Wildcard DNS for cert-lab.local lab domain
# Resolves all *.cert-lab.local to 127.0.0.1 (host loopback).
# Services are accessed via host port mappings (e.g., root-ca.cert-lab.local:8443).
address=/cert-lab.local/127.0.0.1

# Don't read /etc/resolv.conf or /etc/hosts
no-resolv
no-hosts

# Only listen on container interface
interface=eth0
bind-interfaces

# Forward non-lab queries to upstream DNS
server=8.8.8.8
server=8.8.4.4

# Disable DHCP
no-dhcp-interface=eth0

# Service → Port reference (DNS resolves all to 127.0.0.1; port is in the URL):
#
# PKI CAs (rootful, HTTPS):
#   root-ca.cert-lab.local:8443          RSA Root CA
#   intermediate-ca.cert-lab.local:8444  RSA Intermediate CA
#   iot-ca.cert-lab.local:8445           RSA IoT Sub-CA
#   ocsp.cert-lab.local:8448             RSA OCSP Responder
#   kra.cert-lab.local:8449              RSA KRA
#   ecc-root-ca.cert-lab.local:8463      ECC Root CA
#   ecc-intermediate-ca.cert-lab.local:8464
#   ecc-iot-ca.cert-lab.local:8465
#   pq-root-ca.cert-lab.local:8453       PQ Root CA
#   pq-intermediate-ca.cert-lab.local:8454
#   pq-iot-ca.cert-lab.local:8455
