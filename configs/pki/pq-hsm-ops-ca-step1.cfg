# RSA-4096 Ops CA - Step 1: CSR Generation
# Cross-signed by PQ Intermediate CA for bidirectional trust.
# Issues operational certs (TLS, admin, subsystem, audit) that require
# TLS client auth compatibility — ML-DSA-87 certs can't be used for
# NSS client-side TLS authentication.
#
# HSM-backed: signing key in Kryoptic slot 5 (RSA Ops CA)

[DEFAULT]
pki_admin_email=admin@cert-lab.local
pki_admin_name=admin
pki_admin_password=RedHat123
pki_admin_uid=admin

pki_client_database_password=RedHat123
pki_server_database_password=RedHat123
pki_client_pkcs12_password=RedHat123

# Kryoptic HSM (PKCS#11)
pki_hsm_enable=True
pki_hsm_modulename=kryoptic
pki_hsm_libfile=/var/lib/kryoptic/libkryoptic_pkcs11.so
pki_token_name=RSA Ops CA
pki_token_password=12345678

# Directory Server
pki_ds_url=ldap://ds-pq-ops.cert-lab.local:3389
pki_ds_bind_dn=cn=Directory Manager
pki_ds_password=RedHat123
pki_ds_database=ops-ca
pki_ds_base_dn=dc=pki,dc=ops-ca

# Security domain — join the PQ Root CA's domain
pki_security_domain_hostname=pq-root-ca.cert-lab.local
pki_security_domain_https_port=8443
pki_security_domain_name=CERT-LAB-PQ
pki_security_domain_user=caadmin
pki_security_domain_password=RedHat123

# Instance
pki_instance_name=pki-pq-ops-ca
pki_https_port=8443
pki_http_port=8080
pki_ajp_port=8009
pki_tomcat_server_port=8005

pki_hostname=pq-ops-ca.cert-lab.local

[CA]
# External CA — Step 1 generates CSR for PQ Intermediate to sign
pki_external=True
pki_external_step_two=False

pki_ca_signing_csr_path=/certs/ops-ca-signing.csr

# CA Signing — RSA-4096 (traditional crypto for TLS compatibility)
pki_ca_signing_subject_dn=CN=Ops CA (RSA-4096),OU=PQ Infrastructure,O=Cert-Lab,C=US
pki_ca_signing_key_algorithm=SHA512withRSA
pki_ca_signing_key_size=4096
pki_ca_signing_key_type=rsa
pki_ca_signing_signing_algorithm=SHA512withRSA

# OCSP Signing — RSA-4096
pki_ocsp_signing_subject_dn=CN=OCSP Signing Certificate,OU=Ops CA,O=Cert-Lab,C=US
pki_ocsp_signing_key_algorithm=SHA512withRSA
pki_ocsp_signing_key_size=4096
pki_ocsp_signing_key_type=rsa
pki_ocsp_signing_signing_algorithm=SHA512withRSA

# Audit Signing — RSA-4096
pki_audit_signing_subject_dn=CN=Audit Signing Certificate,OU=Ops CA,O=Cert-Lab,C=US
pki_audit_signing_key_algorithm=SHA512withRSA
pki_audit_signing_key_size=4096
pki_audit_signing_key_type=rsa
pki_audit_signing_signing_algorithm=SHA512withRSA

# Subsystem — RSA-4096
pki_subsystem_subject_dn=CN=Subsystem Certificate,OU=Ops CA,O=Cert-Lab,C=US
pki_subsystem_key_algorithm=SHA512withRSA
pki_subsystem_key_size=4096
pki_subsystem_key_type=rsa

# TLS Server — RSA-4096
pki_sslserver_subject_dn=CN=pq-ops-ca.cert-lab.local,OU=Ops CA,O=Cert-Lab,C=US
pki_sslserver_key_algorithm=SHA512withRSA
pki_sslserver_key_size=4096
pki_sslserver_key_type=rsa

# Admin — RSA-4096
pki_admin_subject_dn=CN=PKI Administrator,OU=Ops CA,O=Cert-Lab,C=US
pki_admin_key_algorithm=SHA512withRSA
pki_admin_key_size=4096
pki_admin_key_type=rsa
