# caServerKeygenEST.cfg — Server-Side Keygen profile for Kipuka (EST RA)
#
# Modeled on the stock caServerKeygen_UserCert.cfg. The three components that
# make a profile SSKG-capable are marked [SSKG]. Everything else (validity,
# AKI, keyUsage, SAN copy, signing alg) carries over from whatever EST
# profile you already use in cert-revocation-lab.
#
# Auth: AgentCertAuth = Kipuka authenticates with its RA/agent TLS client
# cert and issuance is automatic (no per-request CA agent approval). This is
# the RA pattern — the EST client's own authn/authz already happened at the
# EST layer (OTP, mTLS, Kerberos).

desc=EST Server-Side Keygen Enrollment (keys generated and archived on KRA)
visible=false
enable=true
enableBy=admin
name=EST Server-Side Keygen Enrollment
auth.instance_id=AgentCertAuth

# [SSKG 1/3] Input: carries keyType, keySize, and serverKeygenP12Password.
# Kipuka generates a random one-time P12 password per enrollment and supplies
# it here — the password never comes from, or goes to, the EST client.
input.list=i1,i2
input.i1.class_id=serverKeygenInputImpl
input.i2.class_id=subjectNameInputImpl

# [SSKG 2/3] Output: the enrollment response carries the PKCS#12 (issued
# cert + private key encrypted under serverKeygenP12Password).
output.list=o1
output.o1.class_id=pkcs12OutputImpl

profileId=caServerKeygenEST

policyset.list=estCertSet
policyset.estCertSet.list=1,3,4,5,6,7

policyset.estCertSet.1.constraint.class_id=subjectNameConstraintImpl
policyset.estCertSet.1.constraint.name=Subject Name Constraint
policyset.estCertSet.1.constraint.params.pattern=.*
policyset.estCertSet.1.default.class_id=userSubjectNameDefaultImpl
policyset.estCertSet.1.default.name=Subject Name Default

# [SSKG 3/3] The keygen default. enableArchival=true is what makes the KRA
# retain the private key as an escrow record after generation.
policyset.estCertSet.3.constraint.class_id=keyConstraintImpl
policyset.estCertSet.3.constraint.name=Key Constraint
policyset.estCertSet.3.constraint.params.keyType=-
policyset.estCertSet.3.constraint.params.keyParameters=2048,3072,4096,nistp256,nistp384,nistp521
policyset.estCertSet.3.default.class_id=serverKeygenUserKeyDefaultImpl
policyset.estCertSet.3.default.name=Server-Side Keygen Default
policyset.estCertSet.3.default.params.keyType=RSA
policyset.estCertSet.3.default.params.keySize=2048
policyset.estCertSet.3.default.params.enableArchival=true

# 4..7: validity, extensions, signing — copy from your existing EST profile.
# Recommended for the lab: validityDefault ~90d, AKI, keyUsage
# (keyEncipherment/dataEncipherment for RSA encryption certs), SAN via
# commonNameToSANDefaultImpl or userExtensionDefault as you do today.
#
# NOTES
# - SSKG is intended for ENCRYPTION certs. The KRA generated + escrowed the
#   key, so it can never carry non-repudiation semantics; keep signing certs
#   on the client-keygen EST path.
# - PQ caveat: serverKeygenUserKeyDefaultImpl in 11.10 knows RSA/EC. The
#   ML-DSA-87 end-entity keys in the lab can't ride this profile yet — that's
#   the one place the direct-KRA path (kra_recovery.rs sketch) stays relevant.
