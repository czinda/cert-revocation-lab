# Dogtag PKI OCSP Responder Configuration - Full ML-DSA-87 (Post-Quantum)
# Standalone OCSP responder that gets its signing cert from the PQ Intermediate CA
# and joins the PQ Root CA's security domain.
# Full PQ: ML-DSA-87 for ALL certificates (OCSP, TLS, subsystem, admin, audit)

[DEFAULT]
# Administrative credentials
pki_admin_email=admin@cert-lab.local
pki_admin_name=admin
pki_admin_password=RedHat123
pki_admin_uid=admin

# Security passwords
pki_client_database_password=RedHat123
pki_server_database_password=RedHat123
pki_client_pkcs12_password=RedHat123

# Kryoptic HSM (PKCS#11)
pki_hsm_enable=True
pki_hsm_modulename=kryoptic
pki_hsm_libfile=/var/lib/kryoptic/libkryoptic_pkcs11.so
pki_token_name=PQ OCSP Responder
pki_token_password=12345678

# Directory Server connection
pki_ds_url=ldap://ds-pq-ocsp.cert-lab.local:3389
pki_ds_bind_dn=cn=Directory Manager
pki_ds_password=RedHat123
pki_ds_database=pq-ocsp
pki_ds_base_dn=dc=pki,dc=pq-ocsp

# Security domain on Root CA (diverges from RSA/ECC which use Intermediate CA)
# PQ uses Root CA because the Intermediate CA doesn't host a security domain —
# it joins the Root CA's domain. pkispawn's get_host() needs the HTTPS port (8443)
# to match LDAP entries, even though the web.xml CONFIDENTIAL→NONE patch allows HTTP.
pki_security_domain_hostname=pq-root-ca.cert-lab.local
pki_security_domain_https_port=8443
pki_security_domain_name=CERT-LAB-PQ
pki_security_domain_user=caadmin
pki_security_domain_password=RedHat123

# Instance configuration
pki_instance_name=pki-pq-ocsp
pki_https_port=8443
pki_http_port=8080
pki_ajp_port=8009
pki_tomcat_server_port=8005

# Hostname
pki_hostname=pq-ocsp.cert-lab.local

[OCSP]
# Issuing CA for OCSP signing certificate (HTTP for full PQ — ML-DSA client certs can't auth via HTTPS)
pki_issuing_ca=http://pq-intermediate-ca.cert-lab.local:8080

# OCSP Signing Certificate - ML-DSA-87
pki_ocsp_signing_subject_dn=CN=OCSP Signing Certificate,OU=PQ OCSP Responder,O=Cert-Lab,C=US
pki_ocsp_signing_key_algorithm=ML-DSA-87
pki_ocsp_signing_key_size=87
pki_ocsp_signing_key_type=mldsa
pki_ocsp_signing_signing_algorithm=ML-DSA-87

# Audit Signing Certificate - ML-DSA-87 (full PQ)
pki_audit_signing_subject_dn=CN=Audit Signing Certificate,OU=PQ OCSP Responder,O=Cert-Lab,C=US
pki_audit_signing_key_algorithm=ML-DSA-87
pki_audit_signing_key_size=87
pki_audit_signing_key_type=mldsa
pki_audit_signing_signing_algorithm=ML-DSA-87

# Subsystem Certificate - ML-DSA-87 (full PQ)
pki_subsystem_subject_dn=CN=Subsystem Certificate,OU=PQ OCSP Responder,O=Cert-Lab,C=US
pki_subsystem_key_algorithm=ML-DSA-87
pki_subsystem_key_size=87
pki_subsystem_key_type=mldsa

# SSL Server Certificate - ML-DSA-87 (full PQ, issued by Intermediate CA)
pki_sslserver_subject_dn=CN=pq-ocsp.cert-lab.local,OU=PQ OCSP Responder,O=Cert-Lab,C=US
pki_sslserver_key_algorithm=ML-DSA-87
pki_sslserver_key_size=87
pki_sslserver_key_type=mldsa

# Admin certificate - ML-DSA-87 (full PQ)
pki_admin_subject_dn=CN=PKI Administrator,OU=PQ OCSP Responder,O=Cert-Lab,C=US
pki_admin_key_algorithm=ML-DSA-87
pki_admin_key_size=87
pki_admin_key_type=mldsa
