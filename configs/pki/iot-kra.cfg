# Dogtag PKI Key Recovery Authority — IoT Sub-CA hierarchy
# KRA for server-side key generation (SSKG) under the IoT Sub-CA.
# Joins the IoT CA's security domain, gets certs from IoT CA.
# pkispawn automatically configures the CA↔KRA connector.
#
# Single-step: pkispawn -s KRA -f iot-kra.cfg

[DEFAULT]
pki_admin_email=admin@cert-lab.local
pki_admin_name=kraadmin
pki_admin_password=RedHat123
pki_admin_uid=kraadmin

pki_backup_password=RedHat123
pki_client_database_password=RedHat123
pki_client_pkcs12_password=RedHat123
pki_token_password=RedHat123

# Directory Server — dedicated DS for the IoT KRA
pki_ds_url=ldap://ds-iot-kra.cert-lab.local:3389
pki_ds_bind_dn=cn=Directory Manager
pki_ds_password=RedHat123
pki_ds_database=iot-kra
pki_ds_base_dn=dc=pki,dc=iot-kra

# Security domain — join via the Intermediate CA (which hosts the domain)
# Note: the IoT CA joined the Intermediate CA's domain at init time;
# the KRA must join the same domain for connector registration.
pki_security_domain_hostname=intermediate-ca.cert-lab.local
pki_security_domain_https_port=8443
pki_security_domain_name=CERT-LAB
pki_security_domain_user=caadmin
pki_security_domain_password=RedHat123

# Instance
pki_instance_name=pki-iot-kra
pki_https_port=8443
pki_http_port=8080
pki_ajp_port=8009
pki_tomcat_server_port=8005

pki_hostname=iot-kra.cert-lab.local

[KRA]
# Issuing CA is the IoT Sub-CA. HTTPS is required — install token auth
# on caInternalAuth* profiles only works on the secure port.
# The CA chain (Root + Intermediate + IoT) is imported into the KRA's
# NSS database during pkispawn, and SSL_CERT_FILE covers Python's TLS.
pki_issuing_ca=https://iot-ca.cert-lab.local:8443

pki_storage_subject_dn=CN=DRM Storage Certificate,OU=IoT Key Recovery Authority,O=Cert-Lab,C=US
pki_storage_key_algorithm=SHA512withRSA
pki_storage_key_size=4096
pki_storage_key_type=rsa

pki_transport_subject_dn=CN=DRM Transport Certificate,OU=IoT Key Recovery Authority,O=Cert-Lab,C=US
pki_transport_key_algorithm=SHA512withRSA
pki_transport_key_size=4096
pki_transport_key_type=rsa

pki_audit_signing_subject_dn=CN=Audit Signing Certificate,OU=IoT Key Recovery Authority,O=Cert-Lab,C=US
pki_audit_signing_key_algorithm=SHA512withRSA
pki_audit_signing_key_size=4096
pki_audit_signing_key_type=rsa
pki_audit_signing_signing_algorithm=SHA512withRSA

pki_subsystem_subject_dn=CN=Subsystem Certificate,OU=IoT Key Recovery Authority,O=Cert-Lab,C=US
pki_subsystem_key_algorithm=SHA512withRSA
pki_subsystem_key_size=4096
pki_subsystem_key_type=rsa

pki_sslserver_subject_dn=CN=iot-kra.cert-lab.local,OU=IoT Key Recovery Authority,O=Cert-Lab,C=US
pki_sslserver_key_algorithm=SHA512withRSA
pki_sslserver_key_size=4096
pki_sslserver_key_type=rsa

pki_admin_subject_dn=CN=PKI Administrator,OU=IoT Key Recovery Authority,O=Cert-Lab,C=US
