; stunnel TLS proxy — akamu → Dogtag HTTPS
;
; Terminates TLS to the PQ Dogtag CA so akamu (rustls) can connect
; via plaintext HTTP. Sends agent client cert for mTLS authentication.
; Uses Fedora 44 OpenSSL 3.5+ which supports ML-DSA-87 server certs.

pid = /tmp/stunnel.pid
foreground = yes

[dogtag-proxy]
client = yes
accept = 0.0.0.0:8080
connect = pq-ca.cert-lab.local:8443
cert = /certs/dogtag/agent.pem
key = /certs/dogtag/agent-rsa.key.pem
CAfile = /certs/ca-chain.pem
; Skip server cert verification (self-signed PQ CA)
verify = 0
