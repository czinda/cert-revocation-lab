; stunnel TLS-to-TLS proxy — akamu (rustls) → Dogtag (ML-DSA-87)
;
; Two chained sections through a localhost bridge port:
;   akamu → HTTPS(:8443, RSA cert) → stunnel → HTTPS → Dogtag(:8443, ML-DSA cert)
;
; This preserves the Secure flag on JSESSIONID cookies so
; acmeServerCert's SessionAuthentication works through the tunnel.

pid = /tmp/stunnel.pid
foreground = yes

; Frontend: accept HTTPS from akamu (RSA cert that rustls CAN verify)
[frontend]
accept = 0.0.0.0:8443
connect = 127.0.0.1:18080
cert = /certs/stunnel-pq.cert.pem
key = /certs/stunnel-pq.key.pem

; Backend: connect to Dogtag HTTPS as TLS client
[backend]
client = yes
accept = 127.0.0.1:18080
connect = pq-ca.cert-lab.local:8443
verify = 0
CAfile = /certs/ca-chain.pem
