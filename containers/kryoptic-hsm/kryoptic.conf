# Kryoptic PKCS#11 Token Configuration
#
# Each [[slots]] entry creates an independent token backed by its own
# SQLite database. Token initialization happens automatically on first
# C_Initialize(). Keys are generated by applications (pkispawn, pki CLI)
# calling C_GenerateKeyPair() — Kryoptic handles ML-DSA-87 and ML-KEM-1024
# natively via the --features pqc build flag.
#
# Slot layout:
#   0-2: PQ CA hierarchy (ML-DSA-87 signing)
#   3:   OCSP responder (ML-DSA-87 signing)
#   4:   KRA (ML-KEM-1024 storage + transport)
#   5:   RSA Ops CA (RSA-4096, cross-signed by PQ Intermediate)
#   6:   Kipuka EST (agent + TLS keys)
#   7:   Akamu ACME (agent + TLS keys)
#   8:   PQ agent authentication

# --- PQ CA Hierarchy ---

[[slots]]
slot = 0
description = "PQ Root CA"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/pq-root.sql"

[[slots]]
slot = 1
description = "PQ Intermediate CA"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/pq-intermediate.sql"

[[slots]]
slot = 2
description = "PQ IoT Sub-CA"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/pq-iot.sql"

# --- Subsystem CAs ---

[[slots]]
slot = 3
description = "PQ OCSP Responder"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/pq-ocsp.sql"

[[slots]]
slot = 4
description = "PQ KRA"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/pq-kra.sql"

# --- RSA Ops CA (cross-signed by PQ Intermediate) ---

[[slots]]
slot = 5
description = "RSA Ops CA"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/ops-ca.sql"

# --- Enrollment Servers ---

[[slots]]
slot = 6
description = "Kipuka EST"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/pq-kipuka.sql"

[[slots]]
slot = 7
description = "Akamu ACME"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/pq-akamu.sql"

# --- Agent Authentication ---

[[slots]]
slot = 8
description = "PQ Agent"
dbtype = "sqlite"
dbargs = "/var/lib/kryoptic/tokens/pq-agent.sql"
